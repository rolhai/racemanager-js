name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.RM_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.RM_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.RM_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.RM_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.RM_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.RM_FIREBASE_APP_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };

          for (const [key, value] of Object.entries(config)) {
            if (!value) throw new Error(`Missing Firebase config value: ${key}`);
          }

          fs.writeFileSync(
            'firebase-config.js',
            `window.firebaseConfig = ${JSON.stringify(config, null, 2)};\n`
          );
          NODE

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html app.js styles.css firebase-config.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4